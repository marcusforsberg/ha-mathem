[project]
name = "ha-mathem"
version = "1.0.0" # x-release-please-version
description = "Home Assistant integration for Mathem, plus a standalone Mathem API client"
requires-python = ">=3.12"

# The vendored client depends only on aiohttp (already shipped by Home
# Assistant). These are dev/test extras; the client itself pins nothing here.
[project.optional-dependencies]
dev = ["aiohttp", "pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Nothing here is meant to be importable as an installed package: the
# integration lives under custom_components and the root conftest puts the
# vendored client on sys.path itself. Declaring no packages stops flat-layout
# discovery tripping over blueprints/ and custom_components/, and leaves
# `pip install -e ".[dev]"` doing its real job of pulling the dev extras.
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The vendored client is put on sys.path by the root conftest (appended, so it
# cannot shadow stdlib modules like `calendar`).

[tool.ruff]
line-length = 100
target-version = "py312"
