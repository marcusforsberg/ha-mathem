name: Release

# Opens (and keeps updating) a release pull request based on Conventional
# Commits. Merging that PR tags the version, publishes a GitHub release, which
# is what HACS reads to offer an update, and updates CHANGELOG.md, the
# integration manifest version and pyproject.toml.
#
# "bootstrap-sha" in release-please-config.json is the v1.0.0 commit: releases
# are computed from the commits after it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
