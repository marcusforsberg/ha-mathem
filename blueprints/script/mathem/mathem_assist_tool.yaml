blueprint:
  name: "Mathem: full LLM control"
  author: marcusforsberg
  source_url: https://github.com/marcusforsberg/ha-mathem/blob/main/blueprints/script/mathem/mathem_assist_tool.yaml
  description: >
    Full natural-language control of the Mathem cart through an LLM conversation
    agent. Create a script from this blueprint, then expose that script to Assist
    (Settings -> Voice assistants -> Expose). The agent can then search the
    catalogue, add items (resolved through your dietary profile), change
    quantities, remove items, and read the cart, all from free-form language. The
    agent supplies `action` plus the relevant fields; unlike the local-sentence
    automation there are no fixed phrases.
  domain: script
  homeassistant:
    min_version: "2026.7.0"
  input:
    default_profile:
      name: Default dietary profile
      description: >
        Profile name passed to Mathem for search and add. Leave empty to use
        the integration's configured default profile.
      default: ""
      selector:
        text:

# This top-level description is handed to the conversation agent verbatim as the
# tool description, so it must say WHEN to use the tool and HOW to fill fields.
description: >-
  Manage the user's Mathem online grocery cart. Use this whenever the user wants
  to search Mathem for a product, add an item to the Mathem cart, change an
  item's quantity, remove an item, or ask what (or how much of something) is in
  the cart, or wants a word remembered as a particular product. Set `action` to
  one of search, add, set_quantity, remove, cart, orders, order, set_alias,
  remove_alias or pantry. For add and search, pass a free-text `query` (a product
  name such as "havremjölk"); for set_quantity and remove, pass a numeric
  `product_id` obtained from a prior search or from the cart.

  To add several of an item, pass `quantity` with add (e.g. add "tofu" quantity
  8). Leave `quantity` out when the user did not say a number: a pantry entry can
  carry a default for things never bought singly, and it only applies when no
  quantity was asked for. The response's `quantity` is what was actually added,
  so report that rather than assuming one, and when `quantity_from_pantry` is
  true say it used the usual amount.

  To change an item already in the cart to an exact amount (e.g. from 1 to 6),
  use set_quantity with the item's product_id and the new quantity; get the
  product_id from action cart or a search. To answer whether the cart contains an
  item, or how many, use action cart and read the returned `lines` (each line has
  a name and quantity); do not guess.

  When the user wants a word to mean a specific product from now on ("remember
  that tvättmedel is this one"), use set_alias with `keyword` and `product_id`.
  Take the product_id from a cart line or a search result in this conversation,
  never from memory of an earlier session: set_alias verifies the id exists but
  cannot tell that it is the wrong product. The response returns `resolved_name`,
  so read it back to the user to confirm the right thing was pinned. A pinned
  keyword bypasses the dietary vetoes on every later add, so pin only what the
  user explicitly asked for, and prefer to confirm first when the request was
  spoken. Use remove_alias with `keyword` to undo one, and pantry to list what is
  currently pinned. When the user says something is never bought singly
  ("tvättmedel is always two"), pass `quantity` to set_alias as well and it
  becomes that keyword's standing default. Synonyms for one keyword and
  ask-me-which entries cannot be created here; those need the
  mathem.import_pantry service directly.

  The response reports the resolved product, or a needs_disambiguation status
  with a `prompt` and `candidates` (each with a product_id and name). On
  needs_disambiguation, ask the user the prompt, list the candidates, and once
  they choose, call this tool again with action add and that candidate's
  `product_id` (add accepts either a query or a product_id). If an added item
  comes back with `available: false`, it was added to the cart but is out of
  stock; tell the user, include the `availability_note`, and mention that
  alternatives exist when `has_alternatives` is true. This never places an order
  or checks out.

# Serialise calls so two overlapping requests cannot race the cart.
mode: queued
max: 10

# These fields become the tool parameters the conversation agent fills in.
fields:
  action:
    name: Action
    description: >
      What to do: 'search' to look up products, 'add' to add an item by name,
      'set_quantity' to set an absolute quantity by product id, 'remove' to
      remove a product by id, 'cart' to read the current cart, 'orders' to list
      recent orders with their totals, 'order' to read one placed order in full
      including every line, 'set_alias' to remember a word as a product,
      'remove_alias' to forget one, or 'pantry' to list the remembered words.
    required: true
    selector:
      select:
        options:
          - search
          - add
          - set_quantity
          - remove
          - cart
          - orders
          - order
          - set_alias
          - remove_alias
          - pantry
  query:
    name: Query
    description: Item to search for or add, free text such as "sojamjölk". Used by search and add.
    required: false
    selector:
      text:
  product_id:
    name: Product ID
    description: >
      Exact Mathem product id. Used by set_quantity and remove, and by add to
      add a specific product such as a chosen disambiguation candidate.
    required: false
    selector:
      number:
        mode: box
        min: 1
        max: 99999999
  order_number:
    name: Order number
    description: >
      Used by the order action to read a specific placed order. Omit it to get
      the most recent order.
    required: false
    selector:
      text:
  keyword:
    name: Keyword
    description: >
      The everyday word to remember or forget, used by set_alias and
      remove_alias, for example "tvättmedel".
    required: false
    selector:
      text:
  quantity:
    name: Quantity
    description: >
      Quantity for add and set_quantity, and the standing default quantity for
      set_alias. Omit it for add unless the user asked for a number, so a
      pantry default can apply.
    required: false
    selector:
      number:
        mode: box
        min: 0
        max: 99

sequence:
  - variables:
      profile: !input default_profile
      qty: "{{ (quantity | default(1)) | int(1) }}"
  - choose:
      - conditions: "{{ action == 'search' }}"
        sequence:
          - action: mathem.search_products
            data:
              query: "{{ query }}"
              profile: "{{ profile }}"
              limit: 5
            response_variable: result
      - conditions: "{{ action == 'add' }}"
        sequence:
          # Add a specific product by id (e.g. a chosen disambiguation
          # candidate) when product_id is given, otherwise resolve the query.
          - if: "{{ product_id | default(0) | int > 0 }}"
            then:
              - action: mathem.add_item
                data:
                  product_id: "{{ product_id | int }}"
                  quantity: "{{ qty }}"
                response_variable: result
            else:
              - action: mathem.add_item
                data: >-
                  {{ {'query': query, 'profile': profile}
                     | combine({'quantity': quantity | int}
                               if quantity is defined and quantity is not none
                               else {}) }}
                response_variable: result
      - conditions: "{{ action == 'set_quantity' }}"
        sequence:
          - action: mathem.set_quantity
            data:
              product_id: "{{ product_id | int }}"
              quantity: "{{ qty }}"
            response_variable: result
      - conditions: "{{ action == 'remove' }}"
        sequence:
          - action: mathem.remove_item
            data:
              product_id: "{{ product_id | int }}"
            response_variable: result
      - conditions: "{{ action == 'cart' }}"
        sequence:
          - action: mathem.get_cart
            response_variable: result
      - conditions: "{{ action == 'orders' }}"
        sequence:
          - action: mathem.get_orders
            response_variable: result
      - conditions: "{{ action == 'set_alias' }}"
        sequence:
          - action: mathem.set_alias
            data: >-
              {{ {'keyword': keyword, 'product_id': product_id | int}
                 | combine({'default_quantity': quantity | int}
                           if quantity is defined and quantity is not none
                           else {}) }}
            response_variable: result
      - conditions: "{{ action == 'remove_alias' }}"
        sequence:
          - action: mathem.remove_alias
            data:
              keyword: "{{ keyword }}"
            response_variable: result
      - conditions: "{{ action == 'pantry' }}"
        sequence:
          - action: mathem.export_pantry
            response_variable: result
      - conditions: "{{ action == 'order' }}"
        sequence:
          - action: mathem.get_order
            data: >-
              {{ {'order_number': order_number} if order_number else {} }}
            response_variable: result
    default:
      - variables:
          result:
            error: "Unknown action. Use search, add, set_quantity, remove, cart, orders, order, set_alias, remove_alias or pantry."
  # Return the Mathem service response to the conversation agent so it can
  # phrase the reply (including needs_disambiguation candidates).
  - stop: "done"
    response_variable: result
