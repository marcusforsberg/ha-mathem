blueprint:
  name: "Mathem: local voice control"
  author: marcusforsberg
  source_url: https://github.com/marcusforsberg/ha-mathem/blob/main/blueprints/automation/mathem/mathem_local_voice.yaml
  description: |
    Local Swedish voice control for the Mathem cart, handled by the built-in
    conversation agent (no LLM needed). Covers adding an item (optionally with a
    quantity), changing an item's quantity, checking whether and how many of an
    item is in the cart, removing an item, reading the cart, asking about the
    next delivery, and booking the cheapest morning slot.

    All sentences are configurable and translatable via the inputs below, so you
    can adapt or add phrases without editing the blueprint. Sentence syntax:
    `[optional words]`, `(alternatives|like this)`, `{item}` captures the product
    name, and `{1..99:quantity}` captures a number.

    Notes: local sentence triggers only fire on the built-in agent. If your
    default assistant is an LLM, enable "Prefer handling commands locally" so
    these run first. Local matching is skipped on follow-up turns, so say the
    whole command in one utterance.
  domain: automation
  homeassistant:
    min_version: "2024.8.0"
  input:
    general_settings:
      name: General
      icon: mdi:cog
      input:
        profile:
          name: Dietary profile
          description: Profile name to use when adding items (empty = the integration's default).
          default: ""
          selector:
            text:
        next_delivery_sensor:
          name: Next delivery sensor
          description: The Mathem next-delivery sensor, used to answer "when is my delivery".
          default: sensor.mathem_next_delivery
          selector:
            entity:
              filter:
                - integration: mathem
                  domain: sensor
    sentence_settings:
      name: Sentences
      icon: mdi:chat
      description: >-
        Customize or translate the phrases for each command. Keep the {item}
        wildcard where it appears; it captures the product name. Where a number
        can be captured, {1..99:quantity} is used.
      collapsed: true
      input:
        add_sentences:
          name: Add item
          description: Add a product to the cart. Contains {item}; an optional leading number sets the quantity.
          selector:
            text:
              multiline: false
              multiple: true
          default:
            - "lägg [till ][{1..99:quantity} ]{item} i varukorgen"
            - "lägg till [{1..99:quantity} ]{item} på mathem"
            - "handla [{1..99:quantity} ]{item} på mathem"
            - "köp [{1..99:quantity} ]{item} på mathem"
        set_quantity_sentences:
          name: Change quantity
          description: Set an existing cart item to an exact quantity. Contains {item} and {0..99:quantity}.
          selector:
            text:
              multiline: false
              multiple: true
          default:
            - "ändra {item} till {0..99:quantity}[ på mathem]"
            - "sätt {item} till {0..99:quantity}[ på mathem]"
            - "ändra antalet {item} till {0..99:quantity}[ på mathem]"
        count_sentences:
          name: Check item in cart
          description: Ask whether, and how many of, an item is in the cart. Contains {item}.
          selector:
            text:
              multiline: false
              multiple: true
          default:
            - "har jag {item} i varukorgen[ på mathem]"
            - "hur många {item} har jag i varukorgen[ på mathem]"
            - "hur många {item} finns i varukorgen[ på mathem]"
        remove_sentences:
          name: Remove item
          description: Remove a product from the cart by name. Must contain {item}.
          selector:
            text:
              multiline: false
              multiple: true
          default:
            - "ta bort {item} från varukorgen"
            - "ta bort {item} från mathem"
        cart_sentences:
          name: Read cart
          description: Read the current cart contents and total.
          selector:
            text:
              multiline: false
              multiple: true
          default:
            - "vad ligger i varukorgen[ på mathem]"
            - "vad har (jag|vi) i varukorgen[ på mathem]"
            - "vad finns i varukorgen[ på mathem]"
            - "hur mycket kostar varukorgen[ på mathem]"
            - "visa varukorgen[ på mathem]"
            - "summera varukorgen[ på mathem]"
        delivery_sentences:
          name: Next delivery
          description: Ask when the next delivery arrives.
          selector:
            text:
              multiline: false
              multiple: true
          default:
            - "när kommer min leverans"
            - "när är nästa leverans"
            - "när kommer mathem"
        slot_sentences:
          name: Book cheapest slot
          description: Book the cheapest morning delivery slot within a week.
          selector:
            text:
              multiline: false
              multiple: true
          default:
            - "boka billigaste leverans"
            - "välj billigaste leveranstid"

mode: queued
max: 10

triggers:
  - trigger: conversation
    id: add
    command: !input add_sentences
  - trigger: conversation
    id: set_quantity
    command: !input set_quantity_sentences
  - trigger: conversation
    id: count
    command: !input count_sentences
  - trigger: conversation
    id: remove
    command: !input remove_sentences
  - trigger: conversation
    id: cart
    command: !input cart_sentences
  - trigger: conversation
    id: delivery
    command: !input delivery_sentences
  - trigger: conversation
    id: slot
    command: !input slot_sentences

conditions: []

actions:
  - variables:
      profile: !input profile
      sensor_id: !input next_delivery_sensor
  - choose:
      # --- Add an item (optionally N of it) ----------------------------
      - conditions: "{{ trigger.id == 'add' }}"
        sequence:
          - action: mathem.add_item
            data:
              query: "{{ trigger.slots.item }}"
              quantity: "{{ trigger.slots.quantity | default(1) | int(1) }}"
              profile: "{{ profile }}"
            response_variable: result
          - set_conversation_response: >-
              {% if result.status == 'added' %}
              La till {% if trigger.slots.quantity is defined %}{{ trigger.slots.quantity }} {% endif %}{{ result.resolved_name or trigger.slots.item }}.
              {% if result.available == false %}Obs: {{ result.availability_note or 'varan är slut' }}{% if result.has_alternatives %}, det finns alternativ{% endif %}.{% endif %}
              {% elif result.status == 'needs_disambiguation' %}
              {{ result.prompt or 'Vilken vara menar du?' }}
              {% else %}
              Jag kunde inte lägga till {{ trigger.slots.item }}.
              {% endif %}
      # --- Change an item's quantity (match a cart line by name) -------
      - conditions: "{{ trigger.id == 'set_quantity' }}"
        sequence:
          - action: mathem.get_cart
            response_variable: cart
          - variables:
              needle: "{{ trigger.slots.item | lower }}"
              match: >-
                {% set ns = namespace(line=none) %}
                {% for line in cart.lines %}
                  {% if needle in (line.name | lower) %}{% set ns.line = line %}{% endif %}
                {% endfor %}
                {{ ns.line | to_json }}
          - if: "{{ (match | from_json) is mapping }}"
            then:
              - action: mathem.set_quantity
                data:
                  product_id: "{{ (match | from_json).product_id }}"
                  quantity: "{{ trigger.slots.quantity | int }}"
              - set_conversation_response: "Ändrade {{ (match | from_json).name }} till {{ trigger.slots.quantity }}."
            else:
              - set_conversation_response: "Jag hittade inte {{ trigger.slots.item }} i varukorgen."
      # --- Check whether / how many of an item is in the cart ----------
      - conditions: "{{ trigger.id == 'count' }}"
        sequence:
          - action: mathem.get_cart
            response_variable: cart
          - variables:
              needle: "{{ trigger.slots.item | lower }}"
              found: >-
                {% set ns = namespace(q=0, name=none) %}
                {% for line in cart.lines %}
                  {% if needle in (line.name | lower) %}
                    {% set ns.q = ns.q + (line.quantity | int) %}
                    {% set ns.name = ns.name or line.name %}
                  {% endif %}
                {% endfor %}
                {{ {'q': ns.q, 'name': ns.name} | to_json }}
          - set_conversation_response: >-
              {% set f = found | from_json %}
              {% if f.q | int > 0 %}
              Ja, {{ f.q }} stycken {{ f.name }}.
              {% else %}
              Nej, {{ trigger.slots.item }} ligger inte i varukorgen.
              {% endif %}
      # --- Remove an item (match a cart line by name) ------------------
      - conditions: "{{ trigger.id == 'remove' }}"
        sequence:
          - action: mathem.get_cart
            response_variable: cart
          - variables:
              needle: "{{ trigger.slots.item | lower }}"
              match: >-
                {% set ns = namespace(line=none) %}
                {% for line in cart.lines %}
                  {% if needle in (line.name | lower) %}{% set ns.line = line %}{% endif %}
                {% endfor %}
                {{ ns.line | to_json }}
          - if: "{{ (match | from_json) is mapping }}"
            then:
              - action: mathem.remove_item
                data:
                  product_id: "{{ (match | from_json).product_id }}"
              - set_conversation_response: "Tog bort {{ (match | from_json).name }}."
            else:
              - set_conversation_response: "Jag hittade inte {{ trigger.slots.item }} i varukorgen."
      # --- Read the cart -----------------------------------------------
      - conditions: "{{ trigger.id == 'cart' }}"
        sequence:
          - action: mathem.get_cart
            response_variable: cart
          - set_conversation_response: >-
              {% if cart.unit_count | int == 0 %}
              Varukorgen är tom.
              {% else %}
              Varukorgen innehåller {{ cart.unit_count }} varor för {{ cart.display_price }} {{ cart.currency }}.
              {% endif %}
      # --- Next delivery -----------------------------------------------
      - conditions: "{{ trigger.id == 'delivery' }}"
        sequence:
          - variables:
              window: "{{ state_attr(sensor_id, 'window') if sensor_id else none }}"
          - set_conversation_response: >-
              {% if window %}
              Din nästa leverans är {{ window }}.
              {% else %}
              Jag hittar ingen kommande leverans.
              {% endif %}
      # --- Book the cheapest morning slot ------------------------------
      - conditions: "{{ trigger.id == 'slot' }}"
        sequence:
          - action: mathem.set_delivery_slot
            data:
              predicate:
                open_from: "06:00"
                open_to: "12:00"
              days: 7
            response_variable: slot
          - set_conversation_response: >-
              {% if slot.status == 'selected' %}
              Bokade {{ slot.selection.name or slot.selection.name_short }}.
              {% else %}
              {{ slot.message | default('Jag hittade ingen ledig leveranstid.') }}
              {% endif %}
